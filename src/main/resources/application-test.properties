# Database (Test)
spring.datasource.url=jdbc:postgresql://db:5432/mydb
spring.datasource.username=user
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=update

# Keycloak (Test)
spring.security.oauth2.client.registration.keycloak.client-id=JNBold-test
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.keycloak.issuer-uri=https://auth.jnbold.dk/realms/JNBold-test

# JWT (Test)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://auth.jnbold.dk/realms/JNBold-test
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs

jwt.auth.converter.resource-id=JNBold-test
jwt.auth.converter.principal-attribute=principal_username

# Logging
logging.level.org.springframework.security=INFO
